<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Akun | videobelajar</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="login-page">
    <header>
        <nav class="navbar" aria-label="Navigasi utama">
            <div class="navbar-container">
                <a href="beranda.html" class="navbar-logo" aria-label="Beranda videobelajar">
                    <img src="assets/Logo.png" alt="videobelajar" class="navbar-logo-image">
                </a>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-heading">
                <h1 id="login-title" class="heading-5">Masuk ke Akun</h1>
                <p class="body-small-regular login-description">Yuk, lanjutin belajarmu di videobelajar.</p>
            </div>

            <form class="login-form" method="post">
                <div class="login-field">
                    <label for="email">E-Mail <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="login-field">
                    <label for="password">Kata Sandi <span class="required-mark" aria-hidden="true">*</span></label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <span class="forgot-password">Lupa Password?</span>
                <button class="button button-primary-color-1 login-action" type="submit">Masuk</button>
            </form>

            <a class="button button-primary-color-2 login-action register-link" href="register.html">Daftar</a>

            <div class="login-divider"><span>atau</span></div>

            <div class="button login-google">
                <span class="google-mark" aria-hidden="true">G</span>
                Masuk dengan Google
            </div>
        </section>
    </main>

</body>
</html>
